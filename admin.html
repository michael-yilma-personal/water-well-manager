<!doctype html>
<html lang="en" class="bg-slate-950 text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <title>Drilling Records — Administrator</title>
  </head>
  <body class="bg-slate-950 text-white m-0 p-0">
    <div id="root"></div>
    <script id="support-gate">
      // A browser too old for the app bundle gets a message, not a blank page.
      // Plain ES5 on purpose: this is the only script such a browser can run.
      (function () {
        var root = document.getElementById('root');
        if (!root) return;
        var ok = false;
        try {
          // Syntax the bundle uses: nullish coalescing and optional chaining
          // (Safari 13.1). Escaped so this script itself stays ES5-clean.
          new Function('return (null \x3f\x3f 1) && ({})\x3f.a');
          ok =
            typeof window.CSS !== 'undefined' &&
            typeof CSS.supports === 'function' &&
            // Tailwind 4 colours and cascade layers: Safari 15.4, Chrome 111.
            CSS.supports('color', 'oklch(0 0 0)') &&
            // Record ids and deep copies: Safari 15.4.
            typeof crypto !== 'undefined' &&
            typeof crypto.randomUUID === 'function' &&
            typeof structuredClone === 'function';
        } catch (e) {
          ok = false;
        }
        if (ok) return;
        var agent = String(navigator.userAgent || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;');
        // Renaming the mount point stops the app rendering over this message
        // on a browser that parses the bundle but lacks an API it needs.
        root.id = 'unsupported-browser';
        root.setAttribute(
          'style',
          'min-height:100vh;box-sizing:border-box;padding:48px 24px;' +
            'background:#0a0a0a;color:#fff;' +
            'font-family:-apple-system,Helvetica,Arial,sans-serif;line-height:1.5'
        );
        root.innerHTML =
          '<div style="max-width:560px;margin:0 auto">' +
          '<h1 style="font-size:28px;margin:0 0 16px">' +
          "This device's software is too old for this app</h1>" +
          '<p style="font-size:18px;margin:0 0 12px">' +
          'It needs iPadOS or iOS 16 or newer, or an up-to-date Chrome, Edge, ' +
          'Firefox or Safari. Please open it on a newer device.</p>' +
          '<p style="font-size:18px;margin:0 0 12px">' +
          'On Android, update Chrome and Android System WebView from the Play Store.</p>' +
          '<p style="font-size:16px;margin:0 0 24px;color:#bbb">' +
          'Nothing is wrong with your connection or with the site.</p>' +
          '<p style="font-size:12px;color:#888;word-break:break-all">Browser: ' +
          agent + '</p></div>';
      })();
    </script>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
